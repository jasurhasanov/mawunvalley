<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Cinema — My Neighbor Totoro</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Lato', sans-serif; 
      background: #1a1a2e; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: white; font-family: 'Playfair Display', serif; margin-bottom: 10px; }
    .subtitle { color: #aaa; margin-bottom: 20px; text-align: center; }
    
    .upload-area {
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 20px 30px;
      margin-bottom: 30px;
      text-align: center;
      color: white;
    }
    .upload-area input {
      margin-top: 10px;
    }
    .upload-area.hidden { display: none; }
    
    .poster-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    
    /* Poster - Instagram 4:5 ratio */
    .poster {
      width: 360px;
      height: 450px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      position: relative;
      background: #1a1a2e;
    }
    
    .poster-content {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    /* Image section - full bleed, crops from top */
    .image-section {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-position: center bottom;
      background-size: cover;
      background-repeat: no-repeat;
    }
    
    /* Dark gradient at bottom for text */
    .image-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(26,26,46,0.95) 0%, rgba(26,26,46,0.7) 40%, transparent 100%);
    }
    
    /* Event info at bottom */
    .event-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 28px;
      z-index: 2;
      color: white;
      text-align: center;
    }
    
    .event-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    
    .event-details {
      font-size: 15px;
      opacity: 0.95;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    
    .event-location {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    
    .download-btn {
      background: #9C27B0;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    .download-btn:hover { background: #7B1FA2; }
    .download-btn:disabled { background: #666; cursor: not-allowed; }
    
    .instructions {
      color: #888;
      font-size: 13px;
      margin-top: 20px;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h1>🎬 Outdoor Cinema Poster</h1>
  <p class="subtitle">Single-page poster for Instagram (1080x1350)</p>
  
  <div class="upload-area" id="uploadArea">
    <p>📷 Upload the Totoro poster image:</p>
    <input type="file" id="imageInput" accept="image/*">
  </div>
  
  <div class="poster-wrapper">
    <div class="poster" id="poster">
      <div class="poster-content">
        <div class="image-section" id="imageSection"></div>
        <div class="event-info">
          <div class="event-title">Outdoor Cinema</div>
          <div class="event-details">
            Saturday · 7 PM<br>
            IDR 150k · Popcorn & drinks included
          </div>
          <span class="event-location">Mawun Valley Farm</span>
        </div>
      </div>
    </div>
    
    <button class="download-btn" id="downloadBtn" onclick="downloadPoster()" disabled>Upload image first</button>
  </div>
  
  <p class="instructions">
    Upload the Totoro image, then download the poster.<br>
    Image will be cropped from the top to fit 4:5 ratio.
  </p>
  
  <script>
    const imageInput = document.getElementById('imageInput');
    const imageSection = document.getElementById('imageSection');
    const downloadBtn = document.getElementById('downloadBtn');
    const uploadArea = document.getElementById('uploadArea');
    
    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        imageSection.style.backgroundImage = `url(${event.target.result})`;
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download Poster (1080x1350)';
        uploadArea.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });
    
    async function downloadPoster() {
      const poster = document.getElementById('poster');
      try {
        const canvas = await html2canvas(poster, { 
          scale: 3,
          useCORS: true,
          backgroundColor: null,
          logging: false
        });
        const link = document.createElement('a');
        link.download = 'totoro-outdoor-cinema-poster.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('Download failed:', err);
        alert('Download failed. Please try again.');
      }
    }
  </script>
</body>
</html>
