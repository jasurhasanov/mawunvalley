<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Answer Key — Printable | The Garden Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#1a1a1a;color:white;padding:30px}
h1{text-align:center;font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin-bottom:10px}
.badge{display:inline-block;background:#d4a574;color:white;padding:5px 15px;border-radius:15px;font-size:0.85rem;margin-bottom:20px}
.subtitle{text-align:center;color:#888;margin-bottom:30px}
.download-btn{display:block;width:350px;margin:0 auto 40px;background:linear-gradient(135deg,#d4a574,#c17f59);color:white;border:none;padding:18px 40px;font-size:1.2rem;border-radius:30px;cursor:pointer;font-family:inherit;font-weight:600}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 5px 25px rgba(212,165,116,0.5)}
.download-btn:disabled{opacity:0.6;cursor:wait}
.progress{text-align:center;color:#888;margin-bottom:20px}
.instructions{background:#2a2a2a;border-radius:15px;padding:25px;max-width:600px;margin:0 auto 40px}
.instructions h3{color:#d4a574;margin-bottom:15px}
.instructions ol{padding-left:20px;color:#ccc;line-height:1.8}
.preview{max-width:900px;margin:0 auto}
.preview img{width:100%;border-radius:10px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.sheet-label{color:#888;text-align:center;font-size:0.9rem;margin-bottom:8px}
.back-link{display:block;text-align:center;color:#d4a574;margin-bottom:30px;text-decoration:none}
.hidden{position:absolute;left:-9999px}
</style>
</head>
<body>
<a href="/office/game-kit" class="back-link">← Back to Game Kit</a>
<h1>🔐 Staff Answer Key</h1>
<p style="text-align:center"><span class="badge">Confidential • Staff Only</span></p>
<p class="subtitle">A5 booklet — print double-sided, fold in half!</p>

<button class="download-btn" id="downloadBtn" onclick="generatePDF()">📥 Download A4 PDF (Booklet)</button>
<p class="progress" id="progress"></p>

<div class="instructions">
<h3>🖨️ Print Instructions</h3>
<ol>
<li>Download the PDF (2 A4 pages)</li>
<li>Print <strong>double-sided</strong>, flip on <strong>short edge</strong></li>
<li>Fold in half to make an A5 booklet</li>
<li>Keep at Reception — staff only!</li>
</ol>
</div>

<div class="preview" id="preview"></div>
<div id="render-container" class="hidden"></div>

<script>
const EASY = [
  { num: 1, loc: 'Reception', a: 'B. Mango' },
  { num: 2, loc: 'Herbal Remedies', a: 'B. Ginger' },
  { num: 3, loc: 'Banana Garden', a: 'C. Potassium' },
  { num: 4, loc: 'Vegetable Garden', a: 'B. Tomato' },
  { num: 5, loc: 'Pineapple Garden', a: 'C. 18-24 months' },
  { num: 6, loc: 'Strawberry Fields', a: 'B. On the outside' },
  { num: 7, loc: 'Citrus Garden', a: 'C. Vitamin C' },
  { num: 8, loc: 'Mixed Fruits', a: 'C. Night' },
  { num: 9, loc: 'Jabuticaba', a: 'C. Directly on trunk' },
  { num: 10, loc: 'Flower Jungle', a: 'B. Marigold' }
];

const HARD = [
  { num: 1, loc: 'Reception', a: 'C. South Asia' },
  { num: 2, loc: 'Herbal Remedies', a: 'C. Gingerol' },
  { num: 3, loc: 'Banana Garden', a: 'A. Once' },
  { num: 4, loc: 'Vegetable Garden', a: 'C. Cells damaged' },
  { num: 5, loc: 'Pineapple Garden', a: 'B. Bromelain' },
  { num: 6, loc: 'Strawberry Fields', a: 'C. Rose family' },
  { num: 7, loc: 'Citrus Garden', a: 'B. Southeast Asia' },
  { num: 8, loc: 'Mixed Fruits', a: 'C. Hairy' },
  { num: 9, loc: 'Jabuticaba', a: 'C. Brazil' },
  { num: 10, loc: 'Flower Jungle', a: 'B. Linalool' }
];

const IMPOSSIBLE = [
  { num: 1, loc: 'Reception', a: 'B. Xanthones' },
  { num: 2, loc: 'Herbal Remedies', a: 'B. Hepatic glucuronidation' },
  { num: 3, loc: 'Banana Garden', a: 'B. 33' },
  { num: 4, loc: 'Vegetable Garden', a: 'C. Ethylene' },
  { num: 5, loc: 'Pineapple Garden', a: 'B. Crassulacean Acid Metabolism' },
  { num: 6, loc: 'Strawberry Fields', a: 'C. 8' },
  { num: 7, loc: 'Citrus Garden', a: 'B. Monoterpene' },
  { num: 8, loc: 'Mixed Fruits', a: 'B. Cactaceae' },
  { num: 9, loc: 'Jabuticaba', a: 'B. Glucose' },
  { num: 10, loc: 'Flower Jungle', a: 'B. GABA-A' }
];

function renderAnswerPage(level, data, color, emoji) {
  const w = 421, h = 595;
  
  let html = '<div style="width:'+w+'px;height:'+h+'px;background:white;font-family:Outfit,sans-serif;padding:20px;border:3px solid '+color+';border-radius:12px;display:flex;flex-direction:column;">';
  
  // Header
  html += '<div style="text-align:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px dashed '+color+';">' +
    '<h1 style="font-family:Cormorant Garamond,serif;font-size:1.4rem;color:'+color+';margin-bottom:3px;">'+emoji+' '+level+' Mode Answers</h1>' +
    '<p style="font-size:0.75rem;color:#888;">Staff Reference Only</p>' +
  '</div>';
  
  // Warning
  html += '<div style="background:#f5f5f5;border:2px solid #333;border-radius:8px;padding:8px;margin-bottom:12px;text-align:center;font-weight:500;font-size:0.7rem;color:#000;">🔒 CONFIDENTIAL — Do not show to guests</div>';
  
  // Answers grid
  html += '<div style="flex:1;display:flex;flex-direction:column;gap:4px;">';
  data.forEach(function(item) {
    html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#FAF8F5;border-radius:6px;">' +
      '<div style="width:22px;height:22px;background:'+color+';color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.65rem;">'+item.num+'</div>' +
      '<span style="flex:1;font-size:0.75rem;color:#5C4D3C;">'+item.loc+'</span>' +
      '<span style="background:'+color+';color:white;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:600;">'+item.a+'</span>' +
    '</div>';
  });
  html += '</div>';
  
  // Footer
  html += '<p style="text-align:center;font-size:0.65rem;color:#888;margin-top:10px;">The Garden Code • Mawun Valley Farm</p>';
  
  html += '</div>';
  return html;
}

function renderScoringPage() {
  const w = 421, h = 595;
  
  return '<div style="width:'+w+'px;height:'+h+'px;background:white;font-family:Outfit,sans-serif;padding:20px;border:3px solid #7D8B6F;border-radius:12px;display:flex;flex-direction:column;">' +
    '<div style="text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px dashed #7D8B6F;">' +
      '<h1 style="font-family:Cormorant Garamond,serif;font-size:1.4rem;color:#7D8B6F;margin-bottom:3px;">🏆 Scoring & Badges</h1>' +
      '<p style="font-size:0.75rem;color:#888;">Quick Reference for Staff</p>' +
    '</div>' +
    
    '<div style="background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;padding:20px;border-radius:12px;margin-bottom:15px;">' +
      '<h3 style="text-align:center;font-size:1rem;margin-bottom:15px;">Maximum Points</h3>' +
      '<div style="display:flex;justify-content:space-around;text-align:center;">' +
        '<div><div style="font-size:0.8rem;opacity:0.9;">🟢 Easy</div><div style="font-size:1.3rem;font-weight:700;">100</div></div>' +
        '<div><div style="font-size:0.8rem;opacity:0.9;">🟡 Hard</div><div style="font-size:1.3rem;font-weight:700;">250</div></div>' +
        '<div><div style="font-size:0.8rem;opacity:0.9;">🔴 Impossible</div><div style="font-size:1.3rem;font-weight:700;">500</div></div>' +
      '</div>' +
    '</div>' +
    
    '<div style="flex:1;">' +
      '<h3 style="color:#d4a574;font-size:0.95rem;margin-bottom:12px;text-align:center;">Badge Thresholds</h3>' +
      '<div style="display:grid;gap:10px;">' +
        '<div style="background:#FAF8F5;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;">' +
          '<span style="font-size:1.8rem;">🥉</span>' +
          '<div><p style="font-weight:600;font-size:0.85rem;color:#2d3a2d;">Explorer Badge</p><p style="font-size:0.75rem;color:#888;">70%+ correct answers</p></div>' +
        '</div>' +
        '<div style="background:#FAF8F5;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;">' +
          '<span style="font-size:1.8rem;">🥈</span>' +
          '<div><p style="font-weight:600;font-size:0.85rem;color:#2d3a2d;">Master Badge</p><p style="font-size:0.75rem;color:#888;">90%+ correct answers</p></div>' +
        '</div>' +
        '<div style="background:#FAF8F5;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;">' +
          '<span style="font-size:1.8rem;">🥇</span>' +
          '<div><p style="font-weight:600;font-size:0.85rem;color:#2d3a2d;">Legend Badge</p><p style="font-size:0.75rem;color:#888;">100% perfect score!</p></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    
    '<div style="background:#d4a574;color:white;padding:12px;border-radius:10px;text-align:center;margin-top:15px;">' +
      '<p style="font-size:0.8rem;font-weight:600;">Remember: Give Learning Guide after checking!</p>' +
    '</div>' +
  '</div>';
}

async function generatePDF() {
  const btn = document.getElementById('downloadBtn');
  const progress = document.getElementById('progress');
  const preview = document.getElementById('preview');
  const container = document.getElementById('render-container');
  
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  preview.innerHTML = '';
  
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  
  // Page 1 (front): Scoring (page 4) and Easy (page 1) - for booklet fold
  progress.textContent = 'Rendering front side...';
  container.innerHTML = '<div id="a4sheet" style="width:842px;height:595px;display:flex;background:white;">' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderScoringPage()+'</div>' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderAnswerPage('Easy', EASY, '#7D8B6F', '🟢')+'</div>' +
  '</div>';
  
  await new Promise(function(r) { setTimeout(r, 500); });
  
  let canvas = await html2canvas(document.getElementById('a4sheet'), {
    scale: 2, backgroundColor: '#FFFFFF', useCORS: true
  });
  
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
  preview.innerHTML += '<p class="sheet-label">Front: Scoring & Easy</p><img src="'+canvas.toDataURL()+'">';
  
  // Page 2 (back): Hard (page 2) and Impossible (page 3)
  progress.textContent = 'Rendering back side...';
  container.innerHTML = '<div id="a4sheet" style="width:842px;height:595px;display:flex;background:white;">' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderAnswerPage('Hard', HARD, '#d4a574', '🟡')+'</div>' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderAnswerPage('Impossible', IMPOSSIBLE, '#6B4E71', '🔴')+'</div>' +
  '</div>';
  
  await new Promise(function(r) { setTimeout(r, 500); });
  
  canvas = await html2canvas(document.getElementById('a4sheet'), {
    scale: 2, backgroundColor: '#FFFFFF', useCORS: true
  });
  
  pdf.addPage();
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
  preview.innerHTML += '<p class="sheet-label">Back: Hard & Impossible</p><img src="'+canvas.toDataURL()+'">';
  
  progress.textContent = 'Saving PDF...';
  pdf.save('answer-key-booklet.pdf');
  
  progress.textContent = '✅ PDF Downloaded!';
  btn.disabled = false;
  btn.textContent = '📥 Download A4 PDF (Booklet)';
}
</script>
</body>
</html>
