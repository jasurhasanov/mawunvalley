<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Cinema — My Neighbor Totoro Carousel</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Lato', sans-serif; 
      background: #1a1a2e; 
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { color: white; font-family: 'Playfair Display', serif; text-align: center; margin-bottom: 10px; }
    .subtitle { color: #aaa; text-align: center; margin-bottom: 30px; }
    
    .upload-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto 40px;
    }
    .upload-section h3 { color: white; margin-bottom: 16px; }
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .upload-slot {
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-slot:hover { background: rgba(255,255,255,0.15); }
    .upload-slot.filled { border-style: solid; border-color: #4CAF50; }
    .upload-slot input { display: none; }
    .upload-slot label { color: #aaa; font-size: 12px; cursor: pointer; display: block; }
    .upload-slot .preview { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; }
    
    .slides-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .slide-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .slide-label { color: #aaa; font-size: 13px; font-weight: 600; }
    
    .slide {
      width: 270px;
      height: 337px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      position: relative;
      background: #2d3e2f;
    }
    
    .slide-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
    }
    
    /* Minimal gradient - just enough for text readability */
    .gradient-subtle::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    
    .slide-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      color: white;
      text-align: center;
    }
    
    /* Minimalist typography */
    .title-main {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .subtitle-small {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 4px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .badge-minimal {
      display: inline-block;
      background: rgba(0,0,0,0.5);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 8px;
      backdrop-filter: blur(4px);
    }
    
    /* No text slide - just the image */
    .no-text .slide-content { display: none; }
    .no-text .gradient-subtle::after { display: none; }
    
    .download-btn {
      background: #9C27B0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    .download-btn:hover { background: #7B1FA2; }
    
    .download-all {
      display: block;
      margin: 30px auto;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
    .download-all:hover { background: #388E3C; }
  </style>
</head>
<body>
  <h1>🎬 Outdoor Cinema — Totoro Carousel</h1>
  <p class="subtitle">Minimalist design — upload images, download slides (1080x1350)</p>
  
  <div class="upload-section">
    <h3>📷 Upload Images (10 slots)</h3>
    <div class="upload-grid" id="uploadGrid"></div>
  </div>
  
  <div class="slides-container" id="slidesContainer"></div>
  
  <button class="download-all" onclick="downloadAll()">⬇️ Download All Slides</button>
  
  <script>
    // Minimalist slide configs - less text, more image
    const slideConfigs = [
      { id: 1, label: 'Cover', title: 'Outdoor Cinema', subtitle: 'My Neighbor Totoro', badge: 'Mawun Valley' },
      { id: 2, label: 'Film', title: 'Studio Ghibli', subtitle: '1988 • Family classic' },
      { id: 3, label: 'When', title: 'Saturday 7PM', badge: 'This week' },
      { id: 4, label: 'Scene', noText: true }, // Pure image
      { id: 5, label: 'Price', title: 'IDR 150k', subtitle: 'Popcorn & drink included' },
      { id: 6, label: 'Scene', noText: true }, // Pure image
      { id: 7, label: 'Scene', noText: true }, // Pure image
      { id: 8, label: 'Vibe', title: 'Under the stars', badge: 'At the farm' },
      { id: 9, label: 'Scene', noText: true }, // Pure image
      { id: 10, label: 'CTA', title: 'See you there', badge: 'Book via WhatsApp' }
    ];
    
    const images = {};
    
    // Create upload slots
    const uploadGrid = document.getElementById('uploadGrid');
    slideConfigs.forEach((config, i) => {
      const slot = document.createElement('div');
      slot.className = 'upload-slot';
      slot.id = `slot-${config.id}`;
      slot.innerHTML = `
        <input type="file" id="file-${config.id}" accept="image/*" onchange="handleUpload(${config.id}, this)">
        <label for="file-${config.id}">
          <div class="slot-num">${config.id}</div>
          ${config.label}
        </label>
      `;
      uploadGrid.appendChild(slot);
    });
    
    // Create slides
    const slidesContainer = document.getElementById('slidesContainer');
    slideConfigs.forEach(config => {
      const wrapper = document.createElement('div');
      wrapper.className = 'slide-wrapper';
      
      let contentHTML = '';
      if (!config.noText) {
        contentHTML = `
          ${config.title ? `<div class="title-main">${config.title}</div>` : ''}
          ${config.subtitle ? `<div class="subtitle-small">${config.subtitle}</div>` : ''}
          ${config.badge ? `<span class="badge-minimal">${config.badge}</span>` : ''}
        `;
      }
      
      wrapper.innerHTML = `
        <span class="slide-label">Slide ${config.id} — ${config.label}</span>
        <div class="slide ${config.noText ? 'no-text' : ''}" id="slide-${config.id}">
          <div class="slide-bg gradient-subtle" id="bg-${config.id}"></div>
          <div class="slide-content">
            ${contentHTML}
          </div>
        </div>
        <button class="download-btn" onclick="downloadSlide(${config.id})">Download</button>
      `;
      slidesContainer.appendChild(wrapper);
    });
    
    function handleUpload(id, input) {
      const file = input.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        images[id] = e.target.result;
        document.getElementById(`bg-${id}`).style.backgroundImage = `url(${e.target.result})`;
        
        const slot = document.getElementById(`slot-${id}`);
        slot.classList.add('filled');
        
        let preview = slot.querySelector('.preview');
        if (!preview) {
          preview = document.createElement('img');
          preview.className = 'preview';
          slot.insertBefore(preview, slot.firstChild);
        }
        preview.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    async function downloadSlide(id) {
      const slide = document.getElementById(`slide-${id}`);
      try {
        const canvas = await html2canvas(slide, { 
          scale: 4,
          useCORS: true,
          backgroundColor: null,
          logging: false
        });
        const link = document.createElement('a');
        link.download = `totoro-cinema-${String(id).padStart(2, '0')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('Download failed:', err);
        alert('Download failed. Please try again.');
      }
    }
    
    async function downloadAll() {
      for (let i = 1; i <= 10; i++) {
        await downloadSlide(i);
        await new Promise(r => setTimeout(r, 500));
      }
    }
  </script>
</body>
</html>
