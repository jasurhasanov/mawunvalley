<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outdoor Cinema — My Neighbor Totoro Carousel</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Lato', sans-serif; 
      background: #1a1a2e; 
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 { color: white; font-family: 'Playfair Display', serif; text-align: center; margin-bottom: 10px; }
    .subtitle { color: #aaa; text-align: center; margin-bottom: 30px; }
    
    .upload-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto 40px;
    }
    .upload-section h3 { color: white; margin-bottom: 16px; }
    .upload-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .upload-slot {
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-slot:hover { background: rgba(255,255,255,0.15); }
    .upload-slot.filled { border-style: solid; border-color: #4CAF50; }
    .upload-slot input { display: none; }
    .upload-slot label { color: #aaa; font-size: 12px; cursor: pointer; display: block; }
    .upload-slot .preview { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; }
    
    .slides-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .slide-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .slide-label { color: #aaa; font-size: 13px; font-weight: 600; }
    
    .slide {
      width: 270px;
      height: 337px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      position: relative;
      background: #2d3e2f;
    }
    
    .slide-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
    }
    
    /* Gradient overlays */
    .gradient-bottom::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
    }
    .gradient-full::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
    }
    
    .slide-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      color: white;
      text-align: center;
    }
    
    .slide-content.center {
      justify-content: center;
    }
    
    /* Typography */
    .title-large {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .title-med {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .subtitle-text {
      font-size: 14px;
      opacity: 0.95;
      line-height: 1.4;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 10px;
      backdrop-filter: blur(4px);
    }
    .emoji { font-size: 40px; margin-bottom: 12px; }
    
    .info-box {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      backdrop-filter: blur(4px);
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 13px;
    }
    .info-row .icon { font-size: 18px; }
    
    .download-btn {
      background: #9C27B0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    .download-btn:hover { background: #7B1FA2; }
    
    .download-all {
      display: block;
      margin: 30px auto;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
    .download-all:hover { background: #388E3C; }
  </style>
</head>
<body>
  <h1>🎬 Outdoor Cinema — Totoro Carousel</h1>
  <p class="subtitle">Upload images, then download slides (1080x1350)</p>
  
  <div class="upload-section">
    <h3>📷 Upload Images (10 slots)</h3>
    <div class="upload-grid" id="uploadGrid"></div>
  </div>
  
  <div class="slides-container" id="slidesContainer"></div>
  
  <button class="download-all" onclick="downloadAll()">⬇️ Download All Slides</button>
  
  <script>
    const slideConfigs = [
      { id: 1, label: 'Cover', type: 'cover', title: 'Outdoor Cinema', subtitle: 'My Neighbor Totoro', badge: 'Mawun Valley Farm' },
      { id: 2, label: 'Film Info', type: 'info', title: 'This Saturday', emoji: '🎬', lines: ['Studio Ghibli Classic', '86 min • Family Friendly'] },
      { id: 3, label: 'When', type: 'details', title: 'When & Where', items: [
        { icon: '📅', text: 'Saturday' },
        { icon: '⏰', text: '7:00 PM' },
        { icon: '📍', text: 'Mawun Valley Farm' }
      ]},
      { id: 4, label: 'Included', type: 'details', title: "What's Included", items: [
        { icon: '🍿', text: 'Popcorn' },
        { icon: '🥤', text: 'Choice of drink' },
        { icon: '🛋️', text: 'Bean bags' }
      ]},
      { id: 5, label: 'Price', type: 'price', emoji: '🎟️', title: 'IDR 150k', subtitle: 'per person • snacks included' },
      { id: 6, label: 'Family', type: 'quote', emoji: '👨‍👩‍👧‍👦', title: 'Family Friendly', subtitle: 'Kids under 5 free' },
      { id: 7, label: 'Farm Life', type: 'quote', emoji: '🌾', title: 'A night at the farm', subtitle: 'Stars above, stories on screen' },
      { id: 8, label: 'Fresh', type: 'quote', emoji: '🥬', title: 'Fresh from the garden', subtitle: 'Local snacks available' },
      { id: 9, label: 'Adventure', type: 'quote', emoji: '✨', title: 'An evening adventure', subtitle: 'Magic awaits' },
      { id: 10, label: 'CTA', type: 'cta', emoji: '🎬', title: 'See you Saturday!', subtitle: 'Book via WhatsApp', badge: 'mawunvalley.com/gather' }
    ];
    
    const images = {};
    
    // Create upload slots
    const uploadGrid = document.getElementById('uploadGrid');
    slideConfigs.forEach((config, i) => {
      const slot = document.createElement('div');
      slot.className = 'upload-slot';
      slot.id = `slot-${config.id}`;
      slot.innerHTML = `
        <input type="file" id="file-${config.id}" accept="image/*" onchange="handleUpload(${config.id}, this)">
        <label for="file-${config.id}">
          <div class="slot-num">${config.id}</div>
          ${config.label}
        </label>
      `;
      uploadGrid.appendChild(slot);
    });
    
    // Create slides
    const slidesContainer = document.getElementById('slidesContainer');
    slideConfigs.forEach(config => {
      const wrapper = document.createElement('div');
      wrapper.className = 'slide-wrapper';
      wrapper.innerHTML = `
        <span class="slide-label">Slide ${config.id} — ${config.label}</span>
        <div class="slide" id="slide-${config.id}">
          <div class="slide-bg gradient-bottom" id="bg-${config.id}"></div>
          <div class="slide-content ${config.type === 'price' || config.type === 'quote' ? 'center' : ''}">
            ${renderSlideContent(config)}
          </div>
        </div>
        <button class="download-btn" onclick="downloadSlide(${config.id})">Download</button>
      `;
      slidesContainer.appendChild(wrapper);
    });
    
    function renderSlideContent(config) {
      switch(config.type) {
        case 'cover':
          return `
            <div class="title-large">${config.title}</div>
            <div class="subtitle-text">${config.subtitle}</div>
            <span class="badge">${config.badge}</span>
          `;
        case 'info':
          return `
            <div class="emoji">${config.emoji}</div>
            <div class="title-med">${config.title}</div>
            <div class="subtitle-text">${config.lines.join('<br>')}</div>
          `;
        case 'details':
          return `
            <div class="title-med">${config.title}</div>
            <div class="info-box">
              ${config.items.map(item => `
                <div class="info-row">
                  <span class="icon">${item.icon}</span>
                  <span>${item.text}</span>
                </div>
              `).join('')}
            </div>
          `;
        case 'price':
          return `
            <div class="emoji">${config.emoji}</div>
            <div class="title-large">${config.title}</div>
            <div class="subtitle-text">${config.subtitle}</div>
          `;
        case 'quote':
          return `
            <div class="emoji">${config.emoji}</div>
            <div class="title-med">${config.title}</div>
            <div class="subtitle-text">${config.subtitle}</div>
          `;
        case 'cta':
          return `
            <div class="emoji">${config.emoji}</div>
            <div class="title-large">${config.title}</div>
            <div class="subtitle-text">${config.subtitle}</div>
            <span class="badge">${config.badge}</span>
          `;
        default:
          return '';
      }
    }
    
    function handleUpload(id, input) {
      const file = input.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        images[id] = e.target.result;
        document.getElementById(`bg-${id}`).style.backgroundImage = `url(${e.target.result})`;
        
        const slot = document.getElementById(`slot-${id}`);
        slot.classList.add('filled');
        
        // Add preview
        let preview = slot.querySelector('.preview');
        if (!preview) {
          preview = document.createElement('img');
          preview.className = 'preview';
          slot.insertBefore(preview, slot.firstChild);
        }
        preview.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    async function downloadSlide(id) {
      const slide = document.getElementById(`slide-${id}`);
      try {
        const canvas = await html2canvas(slide, { 
          scale: 4,
          useCORS: true,
          backgroundColor: null,
          logging: false
        });
        const link = document.createElement('a');
        link.download = `totoro-cinema-${String(id).padStart(2, '0')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('Download failed:', err);
        alert('Download failed. Please try again.');
      }
    }
    
    async function downloadAll() {
      for (let i = 1; i <= 10; i++) {
        await downloadSlide(i);
        await new Promise(r => setTimeout(r, 500));
      }
    }
  </script>
</body>
</html>
