<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Play — Printable | The Garden Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#1a1a1a;color:white;padding:30px}
h1{text-align:center;font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin-bottom:10px}
.badge{display:inline-block;background:#7D8B6F;color:white;padding:5px 15px;border-radius:15px;font-size:0.85rem;margin-bottom:20px}
.subtitle{text-align:center;color:#888;margin-bottom:30px}
.download-btn{display:block;width:350px;margin:0 auto 40px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border:none;padding:18px 40px;font-size:1.2rem;border-radius:30px;cursor:pointer;font-family:inherit;font-weight:600}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 5px 25px rgba(125,139,111,0.5)}
.download-btn:disabled{opacity:0.6;cursor:wait}
.progress{text-align:center;color:#888;margin-bottom:20px}
.instructions{background:#2a2a2a;border-radius:15px;padding:25px;max-width:600px;margin:0 auto 40px}
.instructions h3{color:#7D8B6F;margin-bottom:15px}
.instructions ol{padding-left:20px;color:#ccc;line-height:1.8}
.preview{max-width:900px;margin:0 auto}
.preview img{width:100%;border-radius:10px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.sheet-label{color:#888;text-align:center;font-size:0.9rem;margin-bottom:8px}
.back-link{display:block;text-align:center;color:#7D8B6F;margin-bottom:30px;text-decoration:none}
.hidden{position:absolute;left:-9999px}
</style>
</head>
<body>
<a href="../game-kit.html" class="back-link">← Back to Game Kit</a>
<h1>🎮 How to Play</h1>
<p style="text-align:center"><span class="badge">Display at Reception</span></p>
<p class="subtitle">Single A5 card — matches original design!</p>

<button class="download-btn" id="downloadBtn" onclick="generatePDF()">📥 Download A5 PDF</button>
<p class="progress" id="progress"></p>

<div class="instructions">
<h3>🖨️ Print Instructions</h3>
<ol>
<li>Download the PDF (single A5 page)</li>
<li>Print on A5 paper, or print 2-per-page on A4</li>
<li>Laminate for durability — display at Reception!</li>
</ol>
</div>

<div class="preview" id="preview"></div>
<div id="render-container" class="hidden"></div>

<script>
function renderA5() {
  const w = 421, h = 595;
  
  return '<div style="width:'+w+'px;height:'+h+'px;background:white;font-family:Outfit,sans-serif;padding:28px;border:3px solid #7D8B6F;border-radius:15px;">' +
    
    // Header - matches original
    '<div style="text-align:center;margin-bottom:22px;padding-bottom:16px;border-bottom:2px dashed #d4a574;">' +
      '<div style="font-size:2.2rem;margin-bottom:6px;">🌿</div>' +
      '<h1 style="font-family:Cormorant Garamond,serif;font-size:1.7rem;color:#2d3a2d;margin-bottom:3px;">How to Play</h1>' +
      '<p style="color:#7D8B6F;font-size:0.85rem;">The Garden Code Adventure</p>' +
    '</div>' +
    
    // Steps - matches original style
    '<div style="margin-bottom:18px;">' +
      '<h2 style="font-family:Cormorant Garamond,serif;font-size:1.15rem;color:#7D8B6F;margin-bottom:12px;">🗺️ Your Journey</h2>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
        '<div style="display:flex;gap:10px;align-items:flex-start;">' +
          '<div style="width:24px;height:24px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.75rem;flex-shrink:0;">1</div>' +
          '<span style="font-size:0.82rem;line-height:1.4;color:#2d3a2d;">Pick up your <strong>Code Journal</strong> at Reception and choose difficulty</span>' +
        '</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-start;">' +
          '<div style="width:24px;height:24px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.75rem;flex-shrink:0;">2</div>' +
          '<span style="font-size:0.82rem;line-height:1.4;color:#2d3a2d;">Follow the map to find <strong>10 checkpoints</strong> in the garden</span>' +
        '</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-start;">' +
          '<div style="width:24px;height:24px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.75rem;flex-shrink:0;">3</div>' +
          '<span style="font-size:0.82rem;line-height:1.4;color:#2d3a2d;">At each checkpoint, <strong>answer the botanical challenge</strong></span>' +
        '</div>' +
        '<div style="display:flex;gap:10px;align-items:flex-start;">' +
          '<div style="width:24px;height:24px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.75rem;flex-shrink:0;">4</div>' +
          '<span style="font-size:0.82rem;line-height:1.4;color:#2d3a2d;">Return to Reception to <strong>check answers</strong> and claim reward!</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    
    // Help Section - matches original
    '<div style="background:linear-gradient(135deg,#f8f6f0,#FAF8F5);border-radius:12px;padding:14px;margin-bottom:16px;border:2px solid #e8e4dc;">' +
      '<h2 style="font-family:Cormorant Garamond,serif;font-size:1.05rem;color:#d4a574;margin-bottom:12px;text-align:center;">🆘 Need Help? Use Your 3 Lifelines!</h2>' +
      '<div style="display:flex;gap:10px;">' +
        '<div style="flex:1;text-align:center;padding:12px 8px;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">' +
          '<div style="font-size:1.6rem;margin-bottom:5px;">🌿</div>' +
          '<div style="font-weight:600;color:#2d3a2d;font-size:0.75rem;margin-bottom:2px;">Observe Nature</div>' +
          '<div style="font-size:0.65rem;color:#8B7355;">Look at the plant for clues</div>' +
        '</div>' +
        '<div style="flex:1;text-align:center;padding:12px 8px;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">' +
          '<div style="font-size:1.6rem;margin-bottom:5px;">👥</div>' +
          '<div style="font-weight:600;color:#2d3a2d;font-size:0.75rem;margin-bottom:2px;">Ask a Friend</div>' +
          '<div style="font-size:0.65rem;color:#8B7355;">Discuss with your group</div>' +
        '</div>' +
        '<div style="flex:1;text-align:center;padding:12px 8px;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">' +
          '<div style="font-size:1.6rem;margin-bottom:5px;">🤝</div>' +
          '<div style="font-weight:600;color:#2d3a2d;font-size:0.75rem;margin-bottom:2px;">Ask Staff</div>' +
          '<div style="font-size:0.65rem;color:#8B7355;">Get a hint from team</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    
    // Scoring - matches original
    '<div style="display:flex;gap:10px;margin-bottom:16px;">' +
      '<div style="flex:1;text-align:center;padding:10px;background:#e8f5e9;border:2px solid #81c784;border-radius:10px;">' +
        '<div style="font-weight:600;font-size:0.75rem;color:#2e7d32;margin-bottom:3px;">🟢 EASY</div>' +
        '<div style="font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:600;color:#2e7d32;">10 pts</div>' +
      '</div>' +
      '<div style="flex:1;text-align:center;padding:10px;background:#fff8e1;border:2px solid #ffca28;border-radius:10px;">' +
        '<div style="font-weight:600;font-size:0.75rem;color:#f57f17;margin-bottom:3px;">🟡 HARD</div>' +
        '<div style="font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:600;color:#f57f17;">25 pts</div>' +
      '</div>' +
      '<div style="flex:1;text-align:center;padding:10px;background:#ffebee;border:2px solid #ef5350;border-radius:10px;">' +
        '<div style="font-weight:600;font-size:0.75rem;color:#c62828;margin-bottom:3px;">🔴 IMPOSSIBLE</div>' +
        '<div style="font-family:Cormorant Garamond,serif;font-size:1.4rem;font-weight:600;color:#c62828;">50 pts</div>' +
      '</div>' +
    '</div>' +
    
    // Footer - matches original
    '<div style="text-align:center;padding:14px;background:#7D8B6F;color:white;border-radius:10px;">' +
      '<div style="font-size:1.05rem;font-weight:600;margin-bottom:3px;">🏆 Complete all 10 checkpoints</div>' +
      '<div style="font-size:0.85rem;opacity:0.95;">Earn your Code Cracker badge!</div>' +
    '</div>' +
    
  '</div>';
}

async function generatePDF() {
  const btn = document.getElementById('downloadBtn');
  const progress = document.getElementById('progress');
  const preview = document.getElementById('preview');
  const container = document.getElementById('render-container');
  
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  preview.innerHTML = '';
  
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
  
  progress.textContent = 'Rendering A5 card...';
  container.innerHTML = '<div id="a5card" style="width:421px;height:595px;background:white;">'+renderA5()+'</div>';
  
  await new Promise(function(r) { setTimeout(r, 500); });
  
  var canvas = await html2canvas(document.getElementById('a5card'), {
    scale: 2, backgroundColor: '#FFFFFF', useCORS: true
  });
  
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 148, 210);
  preview.innerHTML += '<p class="sheet-label">A5 How to Play Card</p><img src="'+canvas.toDataURL()+'">';
  
  progress.textContent = 'Saving PDF...';
  pdf.save('how-to-play-a5.pdf');
  
  progress.textContent = '✅ PDF Downloaded!';
  btn.disabled = false;
  btn.textContent = '📥 Download A5 PDF';
}
</script>
</body>
</html>
