<a href="../game-kit.html" class="back-link">← Back to Game Kit</a>

<p style="text-align:center"><span class="badge">Display at Reception</span></p>
<p class="subtitle">2 A5 cards — print double-sided or separate!</p>

<li>Print and cut in half, OR print double-sided on A5</li>

async function generatePDF() {
  const btn = document.getElementById('downloadBtn');
  const progress = document.getElementById('progress');
  const preview = document.getElementById('preview');
  const container = document.getElementById('render-container');
  
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  preview.innerHTML = '';
  
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  
  // Single A4 page with both A5 cards side by side
  progress.textContent = 'Rendering both A5 cards...';
  container.innerHTML = '<div id="a4sheet" style="width:842px;height:595px;display:flex;background:white;">' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderPage1()+'</div>' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderPage2()+'</div>' +
  '</div>';
  
  await new Promise(function(r) { setTimeout(r, 600); });
  
  var canvas = await html2canvas(document.getElementById('a4sheet'), {
    scale: 2, backgroundColor: '#FFFFFF', useCORS: true
  });
  
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
  preview.innerHTML += '<p class="sheet-label">A4 Sheet: Page 1 (Journey + Lifelines) | Page 2 (Scoring + Badges)</p><img src="'+canvas.toDataURL()+'">';
  
  progress.textContent = 'Saving PDF...';
  pdf.save('how-to-play-a5-cards.pdf');
  
  progress.textContent = '✅ PDF Downloaded! Cut in half for 2 A5 cards.';
  btn.disabled = false;
  btn.textContent = '📥 Download A4 PDF (2-up)';
}
</script>
</body>
</html>
