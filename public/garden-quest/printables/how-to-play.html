<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Play — Printable | The Garden Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#1a1a1a;color:white;padding:30px}
h1{text-align:center;font-family:'Cormorant Garamond',serif;font-size:2.2rem;margin-bottom:10px}
.badge{display:inline-block;background:#7D8B6F;color:white;padding:5px 15px;border-radius:15px;font-size:0.85rem;margin-bottom:20px}
.subtitle{text-align:center;color:#888;margin-bottom:30px}
.download-btn{display:block;width:350px;margin:0 auto 40px;background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;border:none;padding:18px 40px;font-size:1.2rem;border-radius:30px;cursor:pointer;font-family:inherit;font-weight:600}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 5px 25px rgba(125,139,111,0.5)}
.download-btn:disabled{opacity:0.6;cursor:wait}
.progress{text-align:center;color:#888;margin-bottom:20px}
.instructions{background:#2a2a2a;border-radius:15px;padding:25px;max-width:600px;margin:0 auto 40px}
.instructions h3{color:#7D8B6F;margin-bottom:15px}
.instructions ol{padding-left:20px;color:#ccc;line-height:1.8}
.preview{max-width:900px;margin:0 auto}
.preview img{width:100%;border-radius:10px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
.back-link{display:block;text-align:center;color:#7D8B6F;margin-bottom:30px;text-decoration:none}
.hidden{position:absolute;left:-9999px}
</style>
</head>
<body>
<a href="../game-kit.html" class="back-link">← Back to Game Kit</a>
<h1>🎮 How to Play</h1>
<p style="text-align:center"><span class="badge">Display at Reception</span></p>
<p class="subtitle">2 A5 cards on 1 A4 — cut in half for 2 copies!</p>

<button class="download-btn" id="downloadBtn" onclick="generatePDF()">📥 Download A4 PDF (2-up)</button>
<p class="progress" id="progress"></p>

<div class="instructions">
<h3>🖨️ Print Instructions</h3>
<ol>
<li>Download the PDF (single A4 page)</li>
<li>Print on <strong>A4</strong>, <strong>Actual Size (100%)</strong></li>
<li>Cut in half for 2 identical A5 cards</li>
<li>Laminate for durability — display at Reception!</li>
</ol>
</div>

<div class="preview" id="preview"></div>
<div id="render-container" class="hidden"></div>

<script>
function renderCard() {
  const w = 421, h = 595; // A5 portrait
  
  return '<div style="width:'+w+'px;height:'+h+'px;background:white;font-family:Outfit,sans-serif;padding:25px;border:3px solid #7D8B6F;border-radius:15px;display:flex;flex-direction:column;">' +
    '<div style="text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px dashed #d4a574;">' +
      '<div style="font-size:2.5rem;margin-bottom:8px;">🗺️</div>' +
      '<h1 style="font-family:Cormorant Garamond,serif;font-size:1.8rem;color:#2d3a2d;margin-bottom:3px;">The Garden Code</h1>' +
      '<p style="font-size:0.9rem;color:#8B7355;">How to Play</p>' +
    '</div>' +
    
    '<div style="flex:1;display:flex;flex-direction:column;gap:12px;">' +
      // Step 1
      '<div style="display:flex;gap:12px;align-items:flex-start;">' +
        '<div style="width:28px;height:28px;background:#7D8B6F;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;flex-shrink:0;">1</div>' +
        '<div><p style="font-weight:600;color:#2d3a2d;font-size:0.9rem;">Choose Your Difficulty</p><p style="font-size:0.8rem;color:#8B7355;">🟢 Easy (10pts) • 🟡 Hard (25pts) • 🔴 Impossible (50pts)</p></div>' +
      '</div>' +
      // Step 2
      '<div style="display:flex;gap:12px;align-items:flex-start;">' +
        '<div style="width:28px;height:28px;background:#7D8B6F;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;flex-shrink:0;">2</div>' +
        '<div><p style="font-weight:600;color:#2d3a2d;font-size:0.9rem;">Get Your Journal</p><p style="font-size:0.8rem;color:#8B7355;">Pick up your journal booklet at Reception</p></div>' +
      '</div>' +
      // Step 3
      '<div style="display:flex;gap:12px;align-items:flex-start;">' +
        '<div style="width:28px;height:28px;background:#7D8B6F;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;flex-shrink:0;">3</div>' +
        '<div><p style="font-weight:600;color:#2d3a2d;font-size:0.9rem;">Visit 10 Checkpoints</p><p style="font-size:0.8rem;color:#8B7355;">Follow the map, answer questions at each stop</p></div>' +
      '</div>' +
      // Step 4
      '<div style="display:flex;gap:12px;align-items:flex-start;">' +
        '<div style="width:28px;height:28px;background:#7D8B6F;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:0.85rem;flex-shrink:0;">4</div>' +
        '<div><p style="font-weight:600;color:#2d3a2d;font-size:0.9rem;">Return to Reception</p><p style="font-size:0.8rem;color:#8B7355;">Get your answers checked & claim your badge!</p></div>' +
      '</div>' +
      
      // Lifelines
      '<div style="background:#FAF8F5;padding:12px;border-radius:10px;margin-top:5px;">' +
        '<p style="font-weight:600;color:#d4a574;font-size:0.85rem;margin-bottom:8px;">🆘 3 Lifelines Available:</p>' +
        '<div style="display:flex;gap:15px;font-size:0.75rem;color:#5C4D3C;">' +
          '<span>📱 Phone a Friend</span>' +
          '<span>👥 Ask Staff</span>' +
          '<span>⏭️ Skip Question</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    
    // Scoring
    '<div style="background:linear-gradient(135deg,#7D8B6F,#87a878);color:white;padding:15px;border-radius:12px;margin-top:15px;text-align:center;">' +
      '<p style="font-size:0.85rem;font-weight:600;margin-bottom:5px;">🏆 Scoring</p>' +
      '<p style="font-size:0.75rem;opacity:0.95;">70%+ = Explorer Badge • 90%+ = Master Badge • 100% = Legend Badge</p>' +
    '</div>' +
    
    '<p style="text-align:center;font-size:0.7rem;color:#888;margin-top:12px;">mawunvalley.com/garden-quest</p>' +
  '</div>';
}

async function generatePDF() {
  const btn = document.getElementById('downloadBtn');
  const progress = document.getElementById('progress');
  const preview = document.getElementById('preview');
  const container = document.getElementById('render-container');
  
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';
  
  progress.textContent = 'Rendering 2-up layout...';
  
  // 2 identical cards side by side
  container.innerHTML = '<div id="a4sheet" style="width:842px;height:595px;display:flex;background:white;padding:0;">' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderCard()+'</div>' +
    '<div style="width:50%;height:100%;display:flex;align-items:center;justify-content:center;">'+renderCard()+'</div>' +
  '</div>';
  
  await new Promise(function(r) { setTimeout(r, 500); });
  
  const canvas = await html2canvas(document.getElementById('a4sheet'), {
    scale: 2, backgroundColor: '#FFFFFF', useCORS: true
  });
  
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 297, 210);
  
  preview.innerHTML = '<img src="'+canvas.toDataURL()+'">';
  
  progress.textContent = 'Saving PDF...';
  pdf.save('how-to-play-2up.pdf');
  
  progress.textContent = '✅ PDF Downloaded!';
  btn.disabled = false;
  btn.textContent = '📥 Download A4 PDF (2-up)';
}
</script>
</body>
</html>
